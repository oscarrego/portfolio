            <div id="global-menu-container"></div>

            <!-- CORNER BADGE: artwork + rotating circular text ring → about.html -->
            <a class="works-marquee" href="about.html" aria-label="About Oscar">
                <div class="works-marquee-inner">
                    <!-- Rotating circular text ring — only this element spins -->
                    <svg class="works-marquee-ring" viewBox="0 0 260 260" aria-hidden="true">
                        <defs>
                            <!-- Perfect circle centred at (130,130) with r=104 — hugs the image tightly -->
                            <path id="works-marquee-path"
                                  d="M 130,26
                                     a 104,104 0 1,1 -0.001,0
                                     Z" />
                        </defs>
                        <text>
                            <textPath href="#works-marquee-path" startOffset="0%">
                                Oscar © 2026 • About • Oscar © 2026 • About • Oscar © 2026 • About •
                            </textPath>
                        </text>
                    </svg>

                    <!-- Static artwork — bottom_corner.png, slightly tilted -->
                    <img class="works-corner-img"
                         src="images/bottom_corner.png"
                         alt="About"
                         draggable="false"
                         loading="lazy">
                </div>
            </a>
